# Read the Docs configuration file (v2)
# ref: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.10"
  apt_packages:
    # chromium-browser is required by Kaleido to generate Plotly figures via fig.write_image()
    - chromium-browser

python:
  install:
    # Install the project plus the `docs` dependency
    # group from pyproject.toml using `uv sync`
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py

formats:
  - htmlzip
  - pdf
