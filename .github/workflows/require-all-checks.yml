# A single, permanent "required status check" for branch protection.
#
# GitHub's branch protection cannot express "require all checks to pass":
# required status checks must be enumerated by name, and such a list goes
# stale as workflows, job names, and matrix dimensions (e.g., Python
# versions) evolve. Worse, a stale required context that never reports
# again would block every PR until branch protection is manually updated.
#
# Instead, branch protection requires only this workflow's "All checks
# passed" context. The gate job polls the GitHub API for every check run
# and commit status reported on the PR's head commit (excluding itself)
# and:
#   - fails as soon as any of them fails, and
#   - succeeds once all of them have completed successfully (also
#     allowing the "neutral" and "skipped" conclusions), observed stable
#     over a few consecutive polls.
#
# This makes the set of required checks self-maintaining: checks from
# path-filtered workflows are required exactly when they actually run on
# a PR, and new or renamed jobs are picked up automatically.
#
# Caveats (accepted trade-offs):
#   - A check that registers unusually late (after the initial delay plus
#     the stability window) could in theory be missed. In practice, all
#     GitHub Actions check runs are registered as soon as their workflow
#     runs are queued (i.e., within seconds of the triggering event), and
#     the external services used here post a "pending" commit status
#     early on.
#   - If a failed check is re-run and turns green, this gate must be
#     re-run too (one click in the PR's checks UI). Bot PRs are not
#     affected in practice: any push to them re-triggers the gate.
#
name: Require all checks

on:
  pull_request:
    # The labeled/unlabeled events matter because e.g. the "skip news"
    # label re-runs the changelog check and can flip its result
    types: [ opened, reopened, synchronize, labeled, unlabeled ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  all-checks-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Wait for all other checks on this commit
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const OWN_NAME = 'All checks passed';
            const OK_CONCLUSIONS = new Set(['success', 'neutral', 'skipped']);
            const INITIAL_DELAY_S = 60;
            const POLL_INTERVAL_S = 30;
            const REQUIRED_GREEN_POLLS = 3;
            const DEADLINE_MS = Date.now() + 35 * 60 * 1000;

            const ref = process.env.HEAD_SHA;
            const { owner, repo } = context.repo;
            const sleep = (s) => new Promise((resolve) => setTimeout(resolve, s * 1000));

            const snapshot = async () => {
              // Check runs (GitHub Actions jobs and checks posted by apps,
              // e.g. pre-commit.ci and CodeQL). The API's default
              // filter=latest de-duplicates re-runs of the same check.
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref, per_page: 100,
              });
              const checks = runs.filter((run) => run.name !== OWN_NAME);
              // Legacy commit statuses (e.g. codecov, Codacy, CodeFactor,
              // and Read the Docs). The endpoint returns the full history,
              // newest first, so keep only the latest state per context.
              const allStatuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner, repo, ref, per_page: 100,
              });
              const statuses = new Map();
              for (const status of allStatuses) {
                if (!statuses.has(status.context)) statuses.set(status.context, status);
              }
              const failed = [
                ...checks
                  .filter((c) => c.status === 'completed' && !OK_CONCLUSIONS.has(c.conclusion))
                  .map((c) => `${c.name} (${c.conclusion})`),
                ...[...statuses.values()]
                  .filter((s) => s.state === 'failure' || s.state === 'error')
                  .map((s) => `${s.context} (${s.state})`),
              ];
              const pending = [
                ...checks
                  .filter((c) => c.status !== 'completed')
                  .map((c) => `${c.name} (${c.status})`),
                ...[...statuses.values()]
                  .filter((s) => s.state === 'pending')
                  .map((s) => `${s.context} (pending)`),
              ];
              return { total: checks.length + statuses.size, failed, pending };
            };

            // Give the other workflows and services triggered by this
            // event a moment to register their check runs and statuses
            await sleep(INITIAL_DELAY_S);

            let greenPolls = 0;
            while (true) {
              const { total, failed, pending } = await snapshot();
              if (failed.length > 0) {
                core.setFailed(`Failed checks: ${failed.join(', ')}`);
                return;
              }
              if (total > 0 && pending.length === 0) {
                greenPolls += 1;
                core.info(`All ${total} checks green (confirmation ${greenPolls}/${REQUIRED_GREEN_POLLS})`);
                if (greenPolls >= REQUIRED_GREEN_POLLS) {
                  core.info('All checks on this commit have passed.');
                  return;
                }
              } else {
                greenPolls = 0;
                core.info(`Waiting on: ${pending.join(', ') || '(no checks registered yet)'}`);
              }
              if (Date.now() > DEADLINE_MS) {
                core.setFailed(`Timed out waiting for: ${pending.join(', ') || '(no checks registered)'}`);
                return;
              }
              await sleep(POLL_INTERVAL_S);
            }
